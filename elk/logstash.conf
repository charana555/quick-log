input {
  file {
    path => "/usr/share/logstash/external_logs/*.jsonl"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/external_logs/.tracking/sincedb"
    mode => "read"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/external_logs/.tracking/completed_files.log"
    file_chunk_size => 1048576
    codec => "json"
    discover_interval => 5
  }
}

filter {
  # Skip if JSON parsing failed
  if "_jsonparsefailure" in [tags] {
    mutate {
      add_tag => ["invalid_json"]
      remove_tag => ["_jsonparsefailure"]
    }
  } else {
    # Parse the inner JSON string in the "log" field
    if [log] {
      json {
        source => "log"
        remove_field => ["log"]
        skip_on_invalid_json => true
      }
    }

    # Parse timestamp field if present
    if [timestamp] {
      date {
        match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd'T'HH:mm:ss.SSSZ", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'" ]
        target => "@timestamp"
        remove_field => [ "timestamp" ]
      }
    }

    # Remove internal Logstash fields
    mutate {
      remove_field => [ "path", "host", "@version" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "athena-logs"
    action => "index"
  }

  # Optional: Log processing errors
  if "invalid_json" in [tags] {
    file {
      path => "/usr/share/logstash/data/failed_lines.log"
      codec => rubydebug
    }
  }
}